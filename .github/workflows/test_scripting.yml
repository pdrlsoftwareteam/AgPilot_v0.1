name: test scripting

on:
  push:
    paths: # only run for scripting changes
      - 'libraries/AG_Scripting/tests/docs_check.py'
      - 'libraries/AG_Scripting/generator/**'
      - '**.lua'

  pull_request:
    paths: # only run for scripting changes
      - 'libraries/AG_Scripting/tests/docs_check.py'
      - 'libraries/AG_Scripting/generator/**'
      - '**.lua'

  workflow_dispatch:

concurrency:
  group: ci-${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-scripting:
    runs-on: ubuntu-20.04
    container: ardupilot/ardupilot-dev-base:latest
    steps:
      # git checkout the PR
      - uses: actions/checkout@v3
        with:
          submodules: 'recursive'

      - name: Lua Linter
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get -y install lua-check
          ./Tools/scripts/run_luacheck.sh

      - name: copy docs
        run: |
          PATH="/github/home/.local/bin:$PATH"
          mv "libraries/AG_Scripting/docs/docs.lua" "libraries/AG_Scripting/docs/current_docs.lua"

      - name: build sitl # we don't really need to build the full code, just trigger docs re-gen with --scripting-docs, timeout after 10 seconds
        shell: bash
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          PATH="/github/home/.local/bin:$PATH"
          ./waf configure --board sitl
          timeout 10 ./waf antennatracker --scripting-docs || code=$?; if [[ $code -ne 124 && $code -ne 0 ]]; then exit $code; fi

      - name: run compare
        run: |
          PATH="/github/home/.local/bin:$PATH"
          python ./libraries/AG_Scripting/tests/docs_check.py "./libraries/AG_Scripting/docs/docs.lua" "./libraries/AG_Scripting/docs/current_docs.lua"
